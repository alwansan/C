name: Cinemana Toolchain Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jadx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX 1.5.6
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o jadx-1.5.6.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  jadx-1.5.6.zip" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6
          path: jadx-1.5.6.zip
          retention-days: 7
