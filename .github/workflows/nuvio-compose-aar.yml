name: Nuvio 0.5.8 PATCH218 Compose AAR (NOT merged)
on:
  push:
    branches: [cinemana-nuvio-integration]
    paths:
      - '.github/workflows/nuvio-compose-aar.yml'
      - 'integration/patch218/**'
      - 'integration/check_nuvio_aar.py'
      - 'integration/prepare_local_maven_aars.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-compose-aar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuvio-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get integration test scripts
        uses: actions/checkout@v4
      - name: Clone EXACT upstream Nuvio 0.5.8-beta (bypass stale submodule metadata)
        run: |
          git -c submodule.recurse=false clone --depth 1 --branch 0.5.8-beta https://github.com/NuvioMedia/NuvioMobile.git nuvio
          test "$(git -C nuvio rev-parse HEAD)" = "1ae5066a4dd5026228625e40082eacc3ada68436"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform into preinstalled runner SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify and apply PATCH216 Kotlin overlay (17 modified paths)
        run: |
          cat integration/patch218/part_*.txt | base64 --decode | gzip -dc > /tmp/nuvio-bridge.patch
          echo "96b20383083e5446f4f7507815d4179c39fbbfcd8deec5947fcefca0b588391e  /tmp/nuvio-bridge.patch" | sha256sum -c -
          git -C nuvio apply --check /tmp/nuvio-bridge.patch
          git -C nuvio apply /tmp/nuvio-bridge.patch
          git -C nuvio status --short
      - name: Wrap the 12 bundled local AAR files into CI-only Maven coordinates
        run: |
          python3 integration/prepare_local_maven_aars.py nuvio
      - name: Build patched Compose Android library (no applicationId)
        working-directory: nuvio
        run: |
          touch local.properties
          chmod +x ./gradlew
          ./gradlew :composeApp:assemble -Pnuvio.android.distribution=full --no-daemon --stacktrace
      - name: Validate Android library archive has AndroidManifest and compiled resources
        run: |
          python3 integration/check_nuvio_aar.py nuvio/composeApp/build
      - name: Upload library AAR (Nuvio module only)
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-058-PATCH218-compose-aar-NOT-merged
          path: nuvio/composeApp/build/**/*.aar
          if-no-files-found: error
          retention-days: 7
