name: Nuvio 0.5.8 with Cinemana adapter Kotlin overlay (NOT merged)
on:
  push:
    branches: [cinemana-nuvio-integration]
    paths:
      - '.github/workflows/nuvio-patched-ci.yml'
      - 'integration/patch218/**'
      - 'integration/patch219/**'
      - 'integration/check_component_apk.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuvio-patched:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get integration test scripts
        uses: actions/checkout@v4
      - name: Clone EXACT upstream Nuvio 0.5.8-beta (bypass stale submodule metadata)
        run: |
          git -c submodule.recurse=false clone --depth 1 --branch 0.5.8-beta https://github.com/NuvioMedia/NuvioMobile.git nuvio
          test "$(git -C nuvio rev-parse HEAD)" = "1ae5066a4dd5026228625e40082eacc3ada68436"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform into preinstalled runner SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify and apply PATCH216 Kotlin overlay (17 modified paths)
        run: |
          cat integration/patch218/part_*.txt | base64 --decode | gzip -dc > /tmp/nuvio-bridge.patch
          echo "96b20383083e5446f4f7507815d4179c39fbbfcd8deec5947fcefca0b588391e  /tmp/nuvio-bridge.patch" | sha256sum -c -
          git -C nuvio apply --check /tmp/nuvio-bridge.patch
          git -C nuvio apply /tmp/nuvio-bridge.patch
          git -C nuvio status --short
      - name: Apply PATCH219 Media3 player layout isolation
        run: |
          git -C nuvio apply --check ../integration/patch219/media3-player-layout-isolation.patch
          git -C nuvio apply ../integration/patch219/media3-player-layout-isolation.patch
          test -f nuvio/composeApp/src/androidMain/res/layout/nuvio_player_view_shell.xml
      - name: Isolate Nuvio FileProvider resources from Cinemana provider
        run: |
          git -C nuvio apply --check ../integration/patch219/nuvio-fileprovider-isolation.patch
          git -C nuvio apply ../integration/patch219/nuvio-fileprovider-isolation.patch
          test -f nuvio/composeApp/src/androidMain/res/xml/nuvio_file_paths.xml
          test ! -e nuvio/composeApp/src/androidMain/res/xml/file_paths.xml
      - name: Build patched Nuvio fullDebug component
        working-directory: nuvio
        run: |
          touch local.properties
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace
      - name: Validate artifact is NOT a merged Cinemana APK
        run: |
          PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH" python3 integration/check_component_apk.py nuvio/androidApp/build/outputs/apk
      - name: Upload UI baseline APK (not merged)
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-058-PATCH218-patched-ui-NOT-merged
          path: nuvio/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
