name: Nuvio 0.5.8 Android baseline (NOT merged)
on:
  push:
    branches: [cinemana-nuvio-integration]
    paths:
      - '.github/workflows/nuvio-baseline.yml'
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuvio-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get integration test scripts
        uses: actions/checkout@v4
      - name: Checkout EXACT upstream Nuvio 0.5.8-beta
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioMobile
          ref: 0.5.8-beta
          path: nuvio
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install exact compile SDK
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build the Nuvio fullDebug component
        working-directory: nuvio
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace
      - name: Validate artifact is NOT a merged Cinemana APK
        run: |
          python3 integration/check_component_apk.py nuvio/androidApp/build/outputs/apk
      - name: Upload UI baseline APK (not merged)
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-058-fullDebug-component-only
          path: nuvio/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
